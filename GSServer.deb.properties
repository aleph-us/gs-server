# DEB package shape - installs to the fixed, known
# /opt/alephone/sdi-svcs/GSServer/<version>/ path; postinst creates the real
# /var/log/alephone/sdi-svcs/GSServer/ directory this points at, so an
# absolute path is correct and safe here (see
# cmake/deb/per-service/postinst.in).
logging.channels.appFile.path = /var/log/alephone/sdi-svcs/GSServer/${application.baseName}.log

# The shared .sql spool DBLogger scans, not GSServer's own private log dir -
# see the matching comment in RHF.deb.properties.
logging.channels.sql.directory = /var/log/alephone/sdi-svcs/

# Converted PDF/PCL output - local per-service state, not a log (postinst
# already creates and owns this dir for every service, same as var/log; not
# disposed on upgrade/remove, only apt purge - see
# cmake/deb/per-service/postrm.in). Same reasoning as CS.deb.properties'
# filesDir.
filesDir = /var/lib/alephone/sdi-svcs/GSServer/
