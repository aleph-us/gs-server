# DEVELOPMENT overlay for GSServer.properties, pulled in by the trailing
# ?include of the production file. THE PRESENCE OF THIS FILE IS WHAT MAKES AN
# ENVIRONMENT "DEV" - no other switch exists anywhere. It carries ONLY the
# keys that differ from production; everything else is inherited. Never ship
# this file with a production deployment.

# Stops GSSenderTask's send-to-printer step (GSHTTPTask/GSWorkerTask still
# receive the request and do the PCL conversion unconditionally - only the
# actual socket send to the printer is gated, same pattern as CS's own
# readonly). This is what makes CS's dev GSServer redirect
# (httpServer.GS.address in CS.dev.properties) actually safe end-to-end.
readonly = true

# Same paths a DEB deployment resolves to - a dev package ships no
# .deb.properties of its own, so this file is the only place left to set
# them; postinst creates these directories the same way for a dev or prod
# install.
logging.channels.appFile.path = /var/log/alephone/sdi-svcs/GSServer/${application.baseName}.log
logging.channels.sql.directory = /var/log/alephone/sdi-svcs/
filesDir = /var/lib/alephone/sdi-svcs/GSServer/
