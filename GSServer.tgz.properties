# TGZ package shape - a portable, relocatable bundle with no install
# automation (no postinst, no fixed path - the operator decides where to
# extract it), so this can only be a path relative to the bundle itself, not
# an absolute one. The binary sits directly in the version directory (no
# bin/ subdir), so var/log/ as a sibling of the binary is self-contained;
# nothing creates that directory automatically, so it must exist before the
# service is started (mkdir -p var/log next to the binary).
logging.channels.appFile.path = ${application.dir}var/log/${application.baseName}.log
logging.channels.sql.directory = ${application.dir}var/log/

# Converted PDF/PCL output, a sibling of var/log for the same reason -
# self-contained inside the bundle, must exist before the service starts
# (mkdir -p var/out next to the binary).
filesDir = ${application.dir}var/out/
